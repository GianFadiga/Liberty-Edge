name: Build Liberty Edge

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

env:
  FUSIONFIX_REF: v5.1.2
  LE_VERSION: 5.1.2.5

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
    - name: Keep line endings as-is (patches are LF)
      run: git config --global core.autocrlf false

    - name: Checkout Liberty Edge
      uses: actions/checkout@v7
      with:
        path: le

    - name: Checkout FusionFix ${{ env.FUSIONFIX_REF }}
      uses: actions/checkout@v7
      with:
        repository: ThirteenAG/GTAIV.EFLC.FusionFix
        ref: ${{ env.FUSIONFIX_REF }}
        path: fusionfix
        submodules: recursive

    - name: Apply Liberty Edge patches
      shell: bash
      working-directory: fusionfix
      run: |
        set -e
        for p in ../le/patches/*.patch; do
          echo "Applying $p"
          git apply --whitespace=nowarn "$p"
        done
        git diff --stat

    - name: Validate SMAA+ shader variants with fxc
      shell: cmd
      working-directory: fusionfix
      run: |
        set FXC=source\dxsdk\lib\x86\fxc.exe
        set SRC=source\resources\SMAA.hlsl
        set D=/D LE_SMAAPLUS=1 /D LE_TEX_THRESHOLD=0.1000 /D LE_GEO_THRESHOLD=0.0300 /D LE_DEPTH_REL=0.0800 /D LE_SEARCH_STEPS=32 /D LE_SEARCH_STEPS_DIAG=16
        for %%P in (0 1) do for %%G in (0 1) do (
          echo === predication=%%P debug=%%G
          %FXC% /nologo /T ps_3_0 /E DX9_SMAALumaEdgeDetectionPS %D% /D LE_PREDICATION=%%P /D LE_DEBUG=%%G /Fo NUL %SRC% || exit /b 1
          %FXC% /nologo /T ps_3_0 /E DX9_SMAABlendingWeightCalculationPS %D% /D LE_PREDICATION=%%P /D LE_DEBUG=%%G /Fo NUL %SRC% || exit /b 1
          %FXC% /nologo /T ps_3_0 /E DX9_SMAANeighborhoodBlendingPS %D% /D LE_PREDICATION=%%P /D LE_DEBUG=%%G /Fo NUL %SRC% || exit /b 1
          %FXC% /nologo /T vs_3_0 /E DX9_SMAAEdgeDetectionVS %D% /D LE_PREDICATION=%%P /D LE_DEBUG=%%G /Fo NUL %SRC% || exit /b 1
          %FXC% /nologo /T vs_3_0 /E DX9_SMAABlendingWeightCalculationVS %D% /D LE_PREDICATION=%%P /D LE_DEBUG=%%G /Fo NUL %SRC% || exit /b 1
          %FXC% /nologo /T vs_3_0 /E DX9_SMAANeighborhoodBlendingVS %D% /D LE_PREDICATION=%%P /D LE_DEBUG=%%G /Fo NUL %SRC% || exit /b 1
        )

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@main

    - name: Configure build
      working-directory: fusionfix
      run: ./premake5 vs2026 --with-version=${{ env.LE_VERSION }}

    - name: Build
      working-directory: fusionfix
      run: msbuild -m build/GTAIV.EFLC.FusionFix.slnx /property:Configuration=Release /property:Platform=Win32

    - name: Build Wire AA shader (gta_wire.fxc)
      shell: pwsh
      run: |
        $rse = (Resolve-Path fusionfix/tools/RageShaderEditor/RageShaderEditor.exe).Path
        $sh = (Resolve-Path fusionfix/shaders/GTAIV.EFLC.FusionShaders).Path
        $xml = Join-Path $sh 'win32_30_nv8/gta_wire.fxc.xml'
        $out = Join-Path $sh 'win32_30_nv8/gta_wire.fxc'
        function Build-Fxc {
          if (Test-Path $out) { Remove-Item $out }
          $p = Start-Process -FilePath $rse -ArgumentList "`"$xml`"" -WorkingDirectory (Split-Path $rse) -PassThru -NoNewWindow
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "RageShaderEditor timed out" }
          if (-not (Test-Path $out)) { throw "RageShaderEditor did not produce gta_wire.fxc (exit $($p.ExitCode))" }
        }
        # 1) sanity check: the unmodified source must reproduce FusionFix 5.1.2's shipped gta_wire.fxc
        Build-Fxc
        $stock = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
        $expected = '4c55d8a6e4254ee0a761c494c4e76e7d291d9a4f8f02f7c3dc52fe9c337dba1a'
        if ($stock -eq $expected) { Write-Host "Toolchain check OK: stock gta_wire.fxc reproduced" } else { Write-Host "::warning::stock gta_wire.fxc differs from FusionFix 5.1.2 ($stock)" }
        # 2) Liberty Edge Wire AA
        git -C $sh apply --whitespace=nowarn (Resolve-Path le/patches/fusionshaders/0001-wire-aa.patch).Path
        if ($LASTEXITCODE -ne 0) { throw "wire patch did not apply" }
        Build-Fxc
        New-Item -ItemType Directory -Force -Path wireaa | Out-Null
        Copy-Item $out wireaa/gta_wire.fxc
        Get-FileHash wireaa/gta_wire.fxc | Format-List

    - name: Package
      shell: pwsh
      run: |
        $asi = Get-ChildItem -Path fusionfix -Recurse -Filter GTAIV.EFLC.FusionFix.asi | Where-Object { $_.FullName -notmatch '\\data\\' } | Select-Object -First 1
        if (-not $asi) { throw "GTAIV.EFLC.FusionFix.asi not found" }
        Write-Host "asi: $($asi.FullName)"
        New-Item -ItemType Directory -Force -Path pkg/LibertyEdge | Out-Null
        Copy-Item le/installer/* pkg/LibertyEdge/ -Recurse
        New-Item -ItemType Directory -Force -Path pkg/LibertyEdge/files/plugins | Out-Null
        Copy-Item $asi.FullName pkg/LibertyEdge/files/plugins/
        foreach ($m in @('update/common/data', 'update/TBoGT/common/data', 'update/TLAD/common/data')) {
          New-Item -ItemType Directory -Force -Path "pkg/LibertyEdge/files/$m" | Out-Null
          Copy-Item "fusionfix/data/$m/frontend_menus.xml" "pkg/LibertyEdge/files/$m/"
        }
        New-Item -ItemType Directory -Force -Path pkg/LibertyEdge/files/update/common/shaders/win32_30 | Out-Null
        Copy-Item wireaa/gta_wire.fxc pkg/LibertyEdge/files/update/common/shaders/win32_30/
        New-Item -ItemType Directory -Force -Path pkg/LibertyEdge/wireaa | Out-Null
        Copy-Item wireaa/gta_wire.fxc pkg/LibertyEdge/wireaa/
        Copy-Item le/README.md pkg/LibertyEdge/
        Copy-Item le/LICENSE pkg/LibertyEdge/
        Get-FileHash pkg/LibertyEdge/files/plugins/GTAIV.EFLC.FusionFix.asi | Format-List
        (Get-Item pkg/LibertyEdge/files/plugins/GTAIV.EFLC.FusionFix.asi).VersionInfo | Format-List FileVersion,ProductVersion
        Compress-Archive -Path pkg/LibertyEdge -DestinationPath LibertyEdge.zip

    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: LibertyEdge.zip

    - name: Publish release (nightly for main, test-<branch> for other branches)
      if: github.event_name == 'push'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ "$GITHUB_REF_NAME" = "main" ]; then TAG=nightly; else TAG="test-${GITHUB_REF_NAME//\//-}"; fi
        gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
        gh release create "$TAG" LibertyEdge.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
          --title "Liberty Edge ${TAG} (FusionFix ${FUSIONFIX_REF})" \
          --notes "Build automatica do commit ${GITHUB_SHA}. Requer FusionFix ${FUSIONFIX_REF}. Extraia a pasta LibertyEdge ao lado do GTAIV.exe e rode LibertyEdge\\install.bat."
