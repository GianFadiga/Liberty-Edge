name: Build Resolution Unlock

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  MINHOOK_REF: v1.3.4

jobs:
  grass:
    # LibertyEdge.Grass (based on Proper Grass by paulopatine, MIT) is mingw code: built with MSYS2's 32-bit gcc
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW32
        update: false
        install: mingw-w64-i686-gcc
    - name: Build LibertyEdge.Grass.asi
      shell: msys2 {0}
      run: |
        mkdir -p out
        # -mstackrealign: the game (x87 build) calls the hooks with any stack alignment (see upstream build.sh)
        g++ -std=c++17 -O2 -mstackrealign -Wno-multichar -shared -static -s -o out/LibertyEdge.Grass.asi grass/src/ProperGrass.cpp
        sha256sum out/LibertyEdge.Grass.asi
    - uses: actions/upload-artifact@v7
      with:
        name: grass
        path: out/LibertyEdge.Grass.asi

  build:
    needs: grass
    runs-on: windows-2025-vs2026
    steps:
    - uses: actions/checkout@v7

    - name: Get MinHook ${{ env.MINHOOK_REF }}
      shell: bash
      run: git clone --depth 1 --branch "$MINHOOK_REF" https://github.com/TsudaKageyu/minhook.git minhook || git clone --depth 1 https://github.com/TsudaKageyu/minhook.git minhook

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Compile downsample shader (ps_3_0)
      shell: cmd
      run: fxc /nologo /T ps_3_0 /E main /O3 /Vn g_main /Fh src\downsample_ps.h src\downsample.hlsl

    - name: Build ASI (Win32)
      shell: cmd
      run: |
        mkdir out
        cl /nologo /O2 /MT /EHsc /std:c++17 /W3 /DNDEBUG /Iminhook\include /Isrc src\main.cpp minhook\src\buffer.c minhook\src\hook.c minhook\src\trampoline.c minhook\src\hde\hde32.c /LD /Fe:out\LibertyEdge.ResolutionUnlock.asi /link user32.lib gdi32.lib version.lib dxguid.lib
        if errorlevel 1 exit /b 1
        dumpbin /headers out\LibertyEdge.ResolutionUnlock.asi | findstr /I machine

    - uses: actions/download-artifact@v7
      with:
        name: grass
        path: grassout

    - name: Package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path pkg/plugins, pkg/licenses | Out-Null
        Copy-Item out/LibertyEdge.ResolutionUnlock.asi pkg/plugins/
        Copy-Item LibertyEdge.ResolutionUnlock.ini pkg/plugins/
        Copy-Item grassout/LibertyEdge.Grass.asi, grass/LibertyEdge.Grass.ini pkg/plugins/
        Copy-Item grass/LICENSE pkg/licenses/LibertyEdge.Grass-ProperGrass-LICENSE.txt
        Copy-Item README.md, LICENSE pkg/
        Compress-Archive -Path pkg/* -DestinationPath LibertyEdge.ResolutionUnlock.zip
        Get-FileHash out/LibertyEdge.ResolutionUnlock.asi | Format-List

    - uses: actions/upload-artifact@v7
      with:
        archive: false
        path: LibertyEdge.ResolutionUnlock.zip

    - name: Publish release "latest" (main only)
      if: github.event_name == 'push' && github.ref_name == 'main'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
        # old FusionFix-fork builds (no longer maintained)
        for t in nightly test-wire-aa; do gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true; done
        gh release create latest LibertyEdge.ResolutionUnlock.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
          --title "Liberty Edge Resolution Unlock (latest)" \
          --notes "Build of ${GITHUB_SHA}. Extract into the GTA IV folder (the plugins folder goes next to GTAIV.exe), set the game to Borderless Windowed and pick a resolution above your monitor in Graphics > Video Mode."
