[LIBERTYEDGE]                                 // Liberty Edge. SMAA+ is chosen in the menu: Graphics > Antialiasing > SMAA+ (SMAA+ Debug shows the edge mask)
TextureThreshold = 0.10                       // SMAA+ edge sensitivity on surface detail (higher = sharper textures, less AA on texture noise)
GeometryThreshold = 0.03                      // SMAA+ edge sensitivity on object silhouettes (lower = more AA on poles, wires, fences)
DepthEdgeSensitivity = 0.08                   // relative depth jump that counts as a silhouette
SearchSteps = 32                              // edge search length (longer = smoother near-horizontal lines)
SearchStepsDiagonal = 16                      // diagonal edge search length
Downsample = 0                                // EXPERIMENTAL supersampling: 1 + Borderless + a game resolution above the monitor (e.g. -width 3840 -height 2160): the window stays at monitor size and the image is scaled down
