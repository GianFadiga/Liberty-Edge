[MAIN]
Enabled = 1          // 0 disables the mod
Scales = 1.5, 2, 3   // extra Video Mode entries, as multiples of the monitor resolution (1080p: 2880x1620, 3840x2160, 5760x3240)
Filter = 1           // 1: proper box-filtered downsample (recommended) | 0: leave the scaling to the driver/DXVK
Sharpen = 0.3        // contrast adaptive sharpening after the downsample | 0: off | up to 1.0
FitWindow = 1        // keep the window at monitor size when the game resolution is larger
MouseFix = 1         // scale the menu/map cursor from the window to the game resolution
ForceWindowed = 1    // exclusive fullscreen cannot use these modes: switch to windowed instead
